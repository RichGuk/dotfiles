# keyd — caps lock as the primary modifier layer, Linux side.
#
# INSTALL: this lives under Scripts/setup/ rather than .config/ because keyd does
# not read from $HOME — the path here mirrors where it has to end up.
#
#     sudo install -Dm644 ~/Scripts/setup/etc/keyd/default.conf /etc/keyd/default.conf
#     sudo systemctl enable --now keyd
#     sudo keyd reload      # after any later edit
#
# COPY, DO NOT SYMLINK. keyd runs as root and its config supports command(),
# which its man page notes is "executed by the user running the keyd process
# (probably root)". Symlinking /etc/keyd/default.conf at a file I can write as
# my normal user would turn any compromise of this account into root execution.
# Re-run the install line above after editing; that is the intended workflow.
#
# WHAT THIS REPRODUCES
# The same caps layer that Karabiner provides on the MacBook keyboard and that
# QMK bakes into the Air60, so all keyboards behave identically:
#
#     caps + N          -> ctrl+alt+super       -> focus workspace N
#     caps + shift + N  -> ctrl+alt+super+shift -> move window to workspace N
#     caps + h/j/k/l    -> arrow keys
#     caps + [          -> escape
#
# macOS ctrl+opt+cmd == Linux ctrl+alt+super, which is exactly what the Hyprland
# workspace binds already listen for — so no Hyprland rebinding is needed for
# focus. Only move-to-workspace changes, from CTRL ALT SHIFT to CTRL ALT SUPER
# SHIFT, to match the new HYPER scheme on macOS.
#
# The Air60 needs no exclusion here. QMK sends ctrl+alt+super directly and never
# emits a capslock keycode, so the rule below simply never matches it.
#
# NOT doing tap-for-escape: escape is caps + [ on every keyboard already.

[ids]
*

[main]
# Held, capslock activates the nav layer. Tapped it does nothing, deliberately.
capslock = layer(nav)

# Right alt = HYPER, the easier way to reach move-to-workspace than caps+shift.
# This is the key immediately right of the spacebar, i.e. the same physical
# position as right-cmd on the MacBook and on the Air60 in Mac mode — and the
# same key the Air60 sends MEH(KC_LGUI) from in Windows mode. Both routes stay
# available: caps+shift+N does the same thing.
#
# NOTE: this takes right alt, which Hyprland used as the compose key. Compose
# moved to right ctrl (`kb_options = compose:rctrl` in lua/input.lua), which
# reaches accents on a keyboard that has one. The Air60 V2 does not; see the
# alt+3 binding at the bottom of this file.
#
# The Framework 13 has no right-super key (its right-hand modifiers are RAlt and
# RCtrl only), which is why right alt is the pick rather than a super key.
rightalt = layer(hyper)

# C = control, A = alt, M = meta/super. Holding shift on top composes, giving
# ctrl+alt+super+shift for the move-to-workspace binds.
[nav:C-A-M]

h = left
j = down
k = up
l = right

leftbrace = esc

# An empty layer with a modifier set makes the key behave as those modifiers
# while held. ctrl+alt+super+shift == HYPER.
[hyper:C-A-M-S]

# £ on alt+3, matching macOS where option+3 is the sterling sign natively.
#
# Here rather than on a compose key because the Air60 V2 emits no right-hand
# modifier at all — its 64-key layout spends that corner on arrows, and keyd
# monitor confirms the one key right of space sends left ctrl+shift+alt+meta.
# `compose:rctrl` therefore has nothing to bind to on the keyboard actually in
# use, and every other xkb compose position is missing from a 60% board too.
#
# `alt` is keyd's built-in layer for left alt; right alt is layer(hyper) above,
# so this is deliberately the left one, which is also the option key the Mac
# habit uses. A UTF8 value on the right makes keyd emit a sequence from
# /usr/share/keyd/keyd.compose, which ~/.XCompose has to include for anything
# to resolve it, on a plain us layout — which lua/input.lua sets.
[alt]

3 = £
