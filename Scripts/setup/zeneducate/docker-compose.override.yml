# Local-only overrides for this worktree. Gitignored (api/.gitignore).
# `!reset` clears the base list; `!override` replaces it (plain merge appends).

services:
  api:
    ports: !override
      - "${API_PORT:-3000}:3000"

  # The base file publishes ${DB_PORT:-5432}, so without this every worktree
  # fights over host port 5432. Reach the database with api/bin/docker-psql
  # instead of a published port.
  db:
    ports: !reset null

  redis:
    ports: !reset null

  sidekiq:
    ports: !reset null

  sidekiq-shards:
    ports: !reset null

  elasticsearch:
    ports: !reset null

  kibana:
    profiles: [search]

  apm-server:
    profiles: [search]

  mailpit:
    profiles: [mail]

  spamassassin:
    profiles: [mail]
