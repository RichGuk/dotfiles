after-login-command = []
after-startup-command = [
  'exec-and-forget borders active_color=0xffcba6f7 inactive_color=0xff1e1e2e width=5.0 blacklist="Finder,System Settings,VLC,Loom,Todoist"'
]

exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
# Nothing is bound to accordion any more, but keep this non-zero so that if a
# workspace ever ends up in it, the offset edges make it obvious rather than
# looking like windows stacking behind each other.
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# yabai parity: signal window_focused -> sketchybar trigger + dynamic border colour.
on-focus-changed = [
  'exec-and-forget sketchybar --trigger window_focus',
  'exec-and-forget /bin/bash ~/.config/aerospace/update_border_color.sh',
]

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true


# Ported from the yabai `manage=off` rule. AeroSpace matches on app name rather
# than bundle id, and has no equivalent of sub-layer=above, so Finder floats but
# will not stay on top of tiled windows.
[[on-window-detected]]
  if.app-name-regex-substring = '(?i)(displaycal|lulu|calculator|software update|dictionary|vlc|system preferences|system settings|zoom\.us|photo booth|archive utility|app store|steam|raycast|activity monitor|finder|krisp|shottr|browserosaurus|system information|WireGuard)'
  run = 'layout floating'

# yabai floated only Firefox's Library window, not Firefox itself.
[[on-window-detected]]
  if.app-name-regex-substring = '(?i)firefox'
  if.window-title-regex-substring = '(?i)^library$'
  run = 'layout floating'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 15
    inner.vertical =   15
    outer.left =       5
    outer.bottom =     5
    outer.top =        [{ monitor.main = 30 }, { monitor.secondary = 5 }, 30]
    outer.right =      5

[workspace-to-monitor-force-assignment]
  1 = 'main'
  2 = 'main'
  3 = 'main'
  4 = 'main'
  5 = 'main'
  6 = 'main'
  7 = 'main'
  8 = 'main'
  9 = 'main'
  Q = 'secondary'
  W = 'secondary'
  # E = 'secondary'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    # yabai parity: alt-/ was `window --toggle split`. AeroSpace refuses 'split'
    # while the normalizations are on, so toggle the container orientation
    # instead — same practical effect on where the next window lands.
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # yabai parity: alt-f was `window --toggle float --grid 4:4:1:1:2:2`.
    # AeroSpace has no grid placement, so this is float/tile toggle only.
    alt-f = 'layout floating tiling'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left --boundaries all-monitors-outer-frame'
    alt-j = 'focus down --boundaries all-monitors-outer-frame'
    alt-k = 'focus up --boundaries all-monitors-outer-frame'
    alt-l = 'focus right --boundaries all-monitors-outer-frame'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Nest the focused window with its neighbour. With flatten-containers on,
    # opening a third window gives 1|2|3; join-with is how you get 1|(2 over 3).
    ctrl-alt-h = 'join-with left'
    ctrl-alt-j = 'join-with down'
    ctrl-alt-k = 'join-with up'
    ctrl-alt-l = 'join-with right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    shift-alt-minus = 'resize smart -50'
    shift-alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'
    ctrl-alt-cmd-7 = 'workspace 7'
    ctrl-alt-cmd-8 = 'workspace 8'
    ctrl-alt-cmd-9 = 'workspace 9'
    ctrl-alt-cmd-q = 'workspace Q'
    ctrl-alt-cmd-w = 'workspace W'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    # Moved off alt-shift-N onto ctrl-alt-cmd-shift-N (HYPER) to match the yabai binding
    # (`shift + ctrl + alt + cmd - N : yabai -m window --space N && space --focus N`),
    # i.e. caps+shift+N once caps is emitting LCAG.
    # alt-shift-N is deliberately left free: under yabai it focused a space, so
    # keeping "move" there would silently move a window when you meant to switch.
    ctrl-alt-cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    ctrl-alt-cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    ctrl-alt-cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    ctrl-alt-cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    ctrl-alt-cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    ctrl-alt-cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    ctrl-alt-cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    ctrl-alt-cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    ctrl-alt-cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
    ctrl-alt-cmd-shift-q = ['move-node-to-workspace Q', 'workspace Q']
    ctrl-alt-cmd-shift-w = ['move-node-to-workspace W', 'workspace W']

    # alt-f = ['layout floating tiling', 'mode main']
    alt-m = 'fullscreen'
    # alt-m = ['fullscreen toggle', 'mode main']

    alt-equal = 'balance-sizes'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    # yabai parity: alt-tab / shift+alt-tab walked the stack (stack.next/prev).
    # dfs-next/dfs-prev is the AeroSpace equivalent within a workspace tree.
    # This displaces workspace-back-and-forth and move-workspace-to-monitor,
    # which are now on alt-backtick and alt-shift-backtick.
    alt-tab = 'focus dfs-next'
    alt-shift-tab = 'focus dfs-prev'
    alt-backtick = 'workspace-back-and-forth'
    alt-shift-backtick = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    # The Hyprland VM binds the same alt chords this config does, deliberately,
    # so AeroSpace swallows every key the guest wants. Keys unbound in a mode are
    # not intercepted, so vm mode is empty except the way back out.
    alt-shift-v = 'mode vm'

    cmd-h = [] # Disable "hide application"
    cmd-alt-h = []

  alt-enter = 'exec-and-forget osascript ~/Scripts/launch-term.scpt'
  alt-down = 'exec-and-forget open ~'
  alt-up = 'exec-and-forget osascript ~/Scripts/launch-firefox.scpt'
  alt-left = 'exec-and-forget osascript ~/Scripts/launch-chrome.scpt'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Everything passes through to the focused window. For the Hyprland VM, whose
# bindings mirror this config's and would otherwise be eaten by it.
[mode.vm.binding]
    alt-shift-v = 'mode main'
