onboarding = false
# herdr configuration
# Mapped to match the tmux muscle memory in .config/tmux/tmux.conf.

[theme]
name = "catppuccin"

[terminal]
shell_mode = "login"

[keys]
# ctrl+a stays free for beginning-of-line; herdr has no send-prefix, so sharing
# it the way tmux did is not possible. Needs `stty -ixon` (see 00_misc.zsh).
prefix = "ctrl+s"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"
settings = "prefix+shift+s"
close_pane = "prefix+x"

switch_workspace = "prefix+shift+1..9"

next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[ui]
# Sidebar is the whole point — keep it visible.
sidebar_start_collapsed = false

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "off"

# vim-herdr-navigation: ctrl+hjkl moves between nvim splits, then hands off to
# herdr panes at the edge. Installed with `herdr plugin install`.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
