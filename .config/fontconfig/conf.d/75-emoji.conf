<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Emoji come from Noto, not Segoe.

       ttf-ms-win11-auto installs Segoe UI Symbol and Segoe UI Emoji. Both claim
       emoji codepoints and win fallback by scan order, so
       `fc-match ":charset=1F648"` answered Segoe UI Symbol.

       Segoe UI Symbol has no colour tables at all, and Segoe UI Emoji is COLR
       version 1, which kitty and much of the GTK/Qt stack cannot draw. Emoji
       therefore came out flat or blank while Noto Color Emoji sat unused.

       Rejected rather than reordered: fallback order follows the font list, so
       demoting them is not expressible. The rest of the MS fonts are untouched.

       Note for editing: XML comments cannot contain a double hyphen. -->

  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- Rejecting Segoe was not enough on its own: plenty of monochrome fonts
       cover emoji codepoints and win by scan order too, which sent thumbs-up to
       Noto Sans Symbols 2 and a heart to Adwaita Mono. Appending the colour
       font to each generic makes it an explicit member of the pattern, so it is
       consulted before generic fallback. It covers only emoji, so it cannot
       affect text. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Put embedded bitmaps back for this one font. 20-no-embedded.conf turns
       them off for everything, which is right for text: bitmap strikes override
       hinted outlines and look worse. But Noto Color Emoji IS its glyphs in
       CBDT bitmaps, so the blanket rule made every emoji render as nothing in
       anything that honours the setting. Firefox does; kitty rasterises anyway,
       which is why emoji worked in the terminal and not the browser.

       This file sorts after 20-, so this edit wins. -->
  <match target="font">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Segoe UI Emoji</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Segoe UI Symbol</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>

</fontconfig>
