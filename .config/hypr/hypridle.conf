# Idle handling. Hyprlang, not Lua: this is read by hypridle, not Hyprland.
#
# hyprctl dispatch takes Lua (`dpms off` is a syntax error), and hl.dsp.dpms()
# is a toggle that ignores its argument. So never script "DPMS on" here: waking
# is misc.key_press_enables_dpms / mouse_move_enables_dpms in lua/looknfeel.lua.

general {
    lock_cmd = qs ipc call lock lock

    before_sleep_cmd = loginctl lock-session

    # Re-adds DP-2, which comes back dark after suspend. Idempotent, unlike dpms.
    after_sleep_cmd = ~/.config/hypr/scripts/hypr-wake-displays

    inhibit_sleep = 3
}

# Lock after ten minutes.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Blank all outputs after thirty minutes. No dpms on-resume: it is a toggle and
# would re-blank a screen input already woke.
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms(0)'

    # DP-2 wakes dark; only dropping and re-adding the output brings it back.
    on-resume = ~/.config/hypr/scripts/hypr-wake-displays
}

# A monitor block's `disabled = true` is sticky: re-applying mode and position
# does not clear it. Recover with disabled = false explicitly:
#
#     hyprctl eval 'hl.monitor({ output = "DP-2", mode = "1920x1080@60",
#                                position = "320x1440", scale = 1,
#                                disabled = false })'
